<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <title>Midjourney 认证生成系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #45a049; }
        .error { color: red; margin-top: 10px; }
        .logout-btn { margin-bottom: 20px; text-align: right; }
    </style>
</head>
<body>
    <div class="logout-btn">
        <a href="/logout" class="btn btn-outline-danger">
            <i class="fa fa-sign-out"></i> 登出
        </a>
    </div>
    <h1>Midjourney 合作账号认证</h1>
    <form action="/generate" method="POST">
        <label for="rednote_id">小红书ID:</label>
        <input type="text" id="rednote_id" name="rednote_id" required placeholder="例如：12345678">
        
        <label for="account_name">小红书账号名称:</label>
        <input type="text" id="account_name" name="account_name" required placeholder="例如：美妆达人小A">
        
        <label for="valid_days">认证有效期:</label>
        <select id="valid_days" name="valid_days">
            <option value="90">3个月</option>
            <option value="180">6个月</option>
            <option value="365" selected>1年</option>
            <option value="730">2年</option>
        </select>
        
        <button type="submit">生成认证二维码</button>
    </form>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</body>
</html>
